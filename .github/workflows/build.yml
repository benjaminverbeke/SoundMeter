name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional signing secrets. Without them the APK is signed with a throwaway debug key.
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v5

      # Exact latest .NET 10 SDK: pins the build to .NET 10 and gives the cache a precise key.
      # A new SDK release (about monthly) changes the key, so the cache rebuilds once.
      - name: Resolve latest .NET 10 SDK
        id: sdk
        run: |
          v=$(curl -fsSL https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json | jq -r '."latest-sdk"')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Using .NET SDK $v"
          # Own .NET folder (instead of the runner's shared one) so it can be cached with its workloads.
          echo "DOTNET_INSTALL_DIR=$HOME/.dotnet-ci" >> "$GITHUB_ENV"

      - name: Restore .NET SDK + Android workload cache
        id: dotnet-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.DOTNET_INSTALL_DIR }}
          key: dotnet-android-${{ runner.os }}-${{ steps.sdk.outputs.version }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install .NET Android workload
        if: steps.dotnet-cache.outputs.cache-hit != 'true'
        run: dotnet workload install android

      - name: Install Android SDK packages
        run: >
          dotnet build SoundMeter/SoundMeter.csproj -t:InstallAndroidDependencies
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          SIGNING=()
          if [ "$HAS_KEYSTORE" = "true" ]; then
            SIGNING=(
              -p:AndroidKeyStore=true
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore"
              -p:AndroidSigningKeyAlias="$KEY_ALIAS"
              -p:AndroidSigningKeyPass=env:KEYSTORE_PASSWORD
              -p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD
            )
          fi
          # The version code must increase with every update: use the workflow run number.
          dotnet publish SoundMeter/SoundMeter.csproj -c Release -o out \
            -p:AndroidSdkDirectory="$ANDROID_HOME" \
            -p:ApplicationVersion=${{ github.run_number }} \
            "${SIGNING[@]}"

      - uses: actions/upload-artifact@v6
        with:
          name: SoundMeter-apk
          path: out/*-Signed.apk
          if-no-files-found: error
